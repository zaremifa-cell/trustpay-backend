name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - run: docker compose up --build -d --wait
      - name: Wait for API
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: python3 -u scripts/demo.py
      - run: python3 -u scripts/faults.py
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down

  cloud-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/queue-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/queue-publish/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: cloud/queue
      - run: npm test
        working-directory: cloud/queue
