name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - run: docker compose up --build -d --wait
      - name: Wait for API
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: python3 -u scripts/demo.py
      - run: python3 -u scripts/faults.py
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cargo
          key: kubesieve-${{ runner.os }}-v1
      # Our own scanner, as a gate: any medium-or-worse misconfiguration fails the build.
      - name: Scan manifests with kubesieve
        run: |
          command -v kubesieve || cargo install --locked --git https://github.com/zaremifa-cell/kubesieve
          kubesieve scan k8s/base --fail-on medium
      - uses: helm/kind-action@v1
        with:
          cluster_name: trustpay
      - name: Build image into the cluster
        run: |
          docker build -t trustpay:ci .
          kind load docker-image trustpay:ci --name trustpay
      - name: Deploy and wait for rollout
        run: |
          kubectl apply -k k8s/overlays/kind
          kubectl -n trustpay rollout status deploy/postgres --timeout=180s
          kubectl -n trustpay rollout status deploy/rabbitmq --timeout=240s
          kubectl -n trustpay rollout status deploy/redis --timeout=120s
          kubectl -n trustpay rollout status deploy/trustpay --timeout=300s
      - name: Smoke test through the Service
        run: |
          kubectl -n trustpay port-forward svc/trustpay 8080:80 &
          for i in $(seq 1 30); do curl -fsS -u ops:ops-demo localhost:8080/actuator/health && break; sleep 2; done
          curl -fsS -u ops:ops-demo localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl -fsS -u merchant:merchant-demo -X POST localhost:8080/api/customers | grep -q PENDING
          echo "TrustPay is up in Kubernetes: health UP, database and cache reachable, API answering."
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n trustpay get pods,events
          kubectl -n trustpay logs deploy/trustpay --tail=200 || true
          kubectl -n trustpay logs deploy/rabbitmq --previous --tail=80 || kubectl -n trustpay logs deploy/rabbitmq --tail=80 || true

  cloud-bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/queue-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/queue-publish/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: cloud/queue
      - run: npm test
        working-directory: cloud/queue
