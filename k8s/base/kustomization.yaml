# TrustPay on Kubernetes: the API and its Redis cache. PostgreSQL and RabbitMQ are expected as
# managed services (configured in trustpay-config); overlays/kind adds throwaway ones for CI.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trustpay
resources:
  - namespace.yaml
  - config.yaml
  - app.yaml
  - redis.yaml
  - network-policy.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: trustpay
